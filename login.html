<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Login | Madhusanka Tailors</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 800: '#075985' }
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center safe-x px-4 py-8">

  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-2xl sm:text-3xl font-bold text-brand-800" data-i18n="appTitle">Blazer Rental Management</h1>
      <p class="text-slate-500 text-sm mt-2" data-i18n="businessName">Madhusanka Tailors</p>
    </div>

    <div class="bg-white rounded-2xl shadow-lg border border-slate-200 p-6 sm:p-8">
      <h2 class="text-lg font-semibold text-slate-900" data-i18n="loginTitle">Sign In</h2>
      <p class="text-sm text-slate-500 mt-1 mb-6" data-i18n="loginSubtitle">Sign in to access your rental data from any device.</p>

      <form id="loginForm" class="space-y-4">
        <div>
          <label for="username" class="block text-sm font-medium text-slate-700 mb-1" data-i18n="labelUsername">Username</label>
          <input type="text" id="username" name="username" required autocomplete="username"
            class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500"
            data-i18n-placeholder="placeholderUsername" placeholder="Username" />
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-slate-700 mb-1" data-i18n="labelPassword">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password"
            class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500"
            data-i18n-placeholder="placeholderPassword" placeholder="Password" />
        </div>

        <p id="loginError" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2"></p>

        <button type="submit" id="loginBtn"
          class="w-full inline-flex items-center justify-center px-5 py-3 rounded-lg bg-brand-600 text-white text-sm font-semibold hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2 transition-colors disabled:opacity-60 disabled:cursor-not-allowed"
          data-i18n="btnLogin">
          Sign In
        </button>
      </form>

      <div class="mt-5 pt-5 border-t border-slate-100 flex items-center justify-between gap-2">
        <p class="text-xs text-slate-400" data-i18n="loginCloudNote">Data syncs to the cloud after login.</p>
        <div class="inline-flex rounded-lg bg-slate-100 p-1 gap-1 shrink-0" role="group" aria-label="Language">
          <button type="button" id="langEn" data-i18n="langEnglish">English</button>
          <button type="button" id="langSi" data-i18n="langSinhala">සිංහල</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script type="module" src="js/login.js"></script>
</body>
</html>
